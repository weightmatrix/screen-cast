<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>李知本·投屏自由 · 网页接收</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10131b;color:#f3f5fa}body{margin:0;padding:24px;max-width:1100px;margin:auto}h1{font-size:26px;margin-bottom:8px}p{color:#b7bfce;line-height:1.6}form,.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,button{font:inherit;border-radius:12px;padding:13px 18px;border:1px solid #414d64}input{background:#1b2230;color:white;max-width:180px;letter-spacing:2px}button{background:#366ce8;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.secondary{background:#263146}video{width:100%;max-height:72vh;background:#05070b;border-radius:16px;object-fit:contain}#status{min-height:26px;color:#dce6ff}.note{font-size:14px}a{color:#9abaff}@media(max-width:500px){body{padding:16px}h1{font-size:23px}}
</style><script src="./receiver-i18n.js" defer></script><script src="./receiver.js" defer></script></head>
<body><h1>李知本·投屏自由 · <span data-i18n="接收工作台">接收工作台</span></h1><p id="route">打开发送端提供的地址，点击开始接收。</p>
<form id="join"><label><span data-i18n="匹配码">匹配码</span> <input id="code" inputmode="numeric" pattern="[0-9]{6,36}" maxlength="36" autocomplete="off" required aria-label="6至36位数字匹配码"></label><button id="start" data-i18n="开始接收" type="submit">开始接收</button><button id="stop" data-i18n="断开" type="button" class="secondary" disabled>断开</button></form>
<div id="status" data-i18n="等待连接" role="status" aria-live="polite">等待连接</div><video id="video" autoplay playsinline controls muted></video>
<div class="actions"><button id="sound" data-i18n="开启声音" type="button" class="secondary">开启声音</button><button id="fullscreen" data-i18n="全屏观看" type="button" class="secondary">全屏观看</button></div>
<details><summary>连接诊断（仅状态和数量，不含IP或匹配码）</summary><pre id="diagnostics" style="white-space:pre-wrap;font-size:13px">尚未开始</pre></details>
<p class="note" id="notice">画面由发送设备直接传输；不申请摄像头或麦克风权限。请保持页面在前台。</p>
<p class="note"><span data-i18n="请勿利用本工具传播违法信息或侵犯他人合法权益。公网接入须经投送者确认，必要连接日志依法留存。违法使用者依法承担相应责任。">请勿传播违法信息或侵犯他人合法权益。公网接入须经投送者确认，必要连接日志依法留存。违法使用者依法承担相应责任。</span><a href="https://zhibenwang.com/touping/privacy.html" target="_blank" rel="noopener" data-i18n="隐私政策">隐私政策</a></p>
<noscript>需要启用浏览器 JavaScript 才能接收投屏。</noscript></body></html>
