<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>李知本·投屏自由 · 网页接收</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10131b;color:#f3f5fa}body{margin:0;padding:24px;max-width:1100px;margin:auto}h1{font-size:26px;margin-bottom:8px}p{color:#b7bfce;line-height:1.6}form,.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,textarea,button{font:inherit;border-radius:12px;padding:13px 18px;border:1px solid #414d64}textarea{background:#1b2230;color:white;min-width:250px}input{background:#1b2230;color:white;max-width:180px;letter-spacing:2px}button{background:#366ce8;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.secondary{background:#263146}video{width:100%;max-height:72vh;background:#05070b;border-radius:16px;object-fit:contain}#status{min-height:26px;color:#dce6ff}.note{font-size:14px}a{color:#9abaff}@media(max-width:500px){body{padding:16px}h1{font-size:23px}}
#room-chat{position:fixed;z-index:10;width:min(310px,calc(100vw - 48px));padding:12px;border-radius:14px;border:1px solid #52607a}#chat-messages{max-height:210px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#chat-messages>div{padding:7px 0}#chat-form{margin:10px 0}.audio-icon{position:relative;display:inline-block;font-size:26px}.audio-icon>span{position:absolute;bottom:0;left:0;width:100%;height:0;background:#22c55e;opacity:.55;pointer-events:none}select{font:inherit;max-width:240px}input[type=checkbox]{width:auto}body{padding-bottom:120px}
</style><script src="./receiver-i18n.js" defer></script><script src="./receiver-auth.js" defer></script><script src="./receiver-room.js" defer></script><script src="./receiver.js" defer></script></head>
<body><h1>李知本·投屏自由 · <span data-i18n="接收工作台">接收工作台</span></h1><p id="route">打开发送端提供的地址，点击开始接收。</p>
<label><span data-i18n="昵称">昵称</span> <input id="nickname" maxlength="32" autocomplete="off" placeholder="留空自动分配"></label>
<form id="join"><label><span data-i18n="邀请链接或编号">邀请链接或编号</span> <input id="code" maxlength="512" autocomplete="off" required aria-label="邀请链接或编号"></label><label><span data-i18n="连接密码">连接密码</span> <input id="password" type="password" minlength="6" maxlength="256" autocomplete="off" required></label><label><span data-i18n="申请文字（必填，最多200字）">申请文字（必填，最多200字）</span> <textarea id="application" maxlength="200" rows="2" required></textarea></label><button id="start" data-i18n="开始接收" type="submit">开始接收</button><button id="stop" data-i18n="断开" type="button" class="secondary" disabled>断开</button></form>
<div id="status" data-i18n="等待连接" role="status" aria-live="polite">等待连接</div><video id="video" autoplay playsinline controls muted></video>
<div class="actions"><button id="play" type="button" class="secondary" disabled>播放画面</button><button id="sound" data-i18n="开启声音" type="button" class="secondary">开启声音</button><button id="fullscreen" data-i18n="全屏观看" type="button" class="secondary">全屏观看</button></div>
<details><summary>连接诊断（仅状态和数量，不含IP或匹配码）</summary><pre id="diagnostics" style="white-space:pre-wrap;font-size:13px">尚未开始</pre></details>
<p class="note" id="notice">画面由发送设备直接传输；不申请摄像头或麦克风权限。请保持页面在前台。</p>
<p class="note"><span data-i18n="请勿利用本工具传播违法信息或侵犯他人合法权益。公网接入须经投送者确认，必要连接日志依法留存。违法使用者依法承担相应责任。">请勿传播违法信息或侵犯他人合法权益。公网接入须经投送者确认，必要连接日志依法留存。违法使用者依法承担相应责任。</span><a href="https://zhibenwang.com/touping/privacy.html" target="_blank" rel="noopener" data-i18n="隐私政策">隐私政策</a></p>
<details><summary data-i18n="声音设备与测试">声音设备与测试</summary>
<p class="note">麦克风默认关闭。开启后主控和其他接收者都能听见。多人语音建议使用耳机。</p>
<label>麦克风 <span class="audio-icon">🎙<span id="mic-fill"></span></span> <select id="voice-input"><option value="">系统默认</option></select></label>
<label><input type="checkbox" id="voice-toggle">向所有人发送麦克风</label>
<label><input type="checkbox" id="voice-test">测试麦克风（仅看音量）</label><button id="voice-refresh" data-i18n="刷新设备" type="button">刷新设备</button>
<label>喇叭 <span class="audio-icon">🔊<span id="speaker-fill"></span></span> <select id="voice-output"><option value="">系统默认</option></select></label><button id="speaker-test" data-i18n="测试喇叭" type="button">测试喇叭</button><p id="voice-status" role="status"></p>
<label>聊天位置 <select id="chat-position"><option value="bottomLeft">左下角</option><option value="bottomRight">右下角</option><option value="topLeft">左上角</option><option value="topRight">右上角</option></select></label>
<label>聊天透明度 <input type="range" id="chat-opacity" min=".35" max="1" step=".05" value=".9"></label>
</details>
<aside id="room-chat"><button id="chat-toggle" data-i18n="聊天" type="button">聊天</button><div id="chat-body" hidden><strong data-i18n="共用聊天室">共用聊天室</strong><div id="chat-messages" aria-live="polite"></div><form id="chat-form"><input id="chat-draft" maxlength="500" placeholder="输入文字，所有人可见"><button type="submit" data-i18n="发送">发送</button></form><div id="chat-error" role="status"></div></div></aside>
<noscript>需要启用浏览器 JavaScript 才能接收投屏。</noscript></body></html>
